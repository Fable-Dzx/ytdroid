name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Restore or create signing keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            echo "KEYSTORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }}" >> "$GITHUB_ENV"
            echo "::notice::Restored persistent release keystore from secrets"
          else
            # fork / 无 Secrets 时的回退：一次性密钥（注意：仅用于测试，无法覆盖安装升级）
            keytool -genkeypair -v -keystore release.keystore -alias release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ytdroid-ci-pass -keypass ytdroid-ci-pass \
              -dname "CN=ytDroid CI,OU=CI,O=ytDroid,L=Internet,ST=Internet,C=CN"
            echo "KEYSTORE_PASS=ytdroid-ci-pass" >> "$GITHUB_ENV"
            echo "KEYSTORE_ALIAS=release" >> "$GITHUB_ENV"
            echo "::warning::No persistent keystore secret; generated ephemeral keystore"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew || true
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleRelease --no-daemon \
              -PvCode=${{ github.run_number }} -PvName=1.0.${{ github.run_number }}
          else
            gradle assembleRelease --no-daemon \
              -PvCode=${{ github.run_number }} -PvName=1.0.${{ github.run_number }}
          fi

      - name: Print signing certificate fingerprint
        run: |
          keytool -exportcert -keystore release.keystore -alias "$KEYSTORE_ALIAS" -storepass "$KEYSTORE_PASS" -rfc -file /tmp/cert.pem
          openssl x509 -in /tmp/cert.pem -noout -fingerprint -sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytdroid-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TAG="v1.0.${RUN_NUMBER}"
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_NAME="ytDroid-v1.0.${RUN_NUMBER}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} 已存在，跳过创建"
          else
            cp "$APK_SRC" "$APK_NAME"
            gh release create "$TAG" "$APK_NAME" \
              --title "ytDroid v1.0.${RUN_NUMBER}" \
              --notes "本发布由 GitHub Actions 自动生成，可直接安装升级。

- **APK**：${APK_NAME}（arm64-v8a，Android 8.0+）
- **签名**：持久 release 密钥（指纹 E7:C4:F7:F3:88:B0:25:5E:D1:44:61:8A:A4:1E:F3:F9:20:99:33:9D:D9:A7:87:58:C0:BD:ED:8F:3D:C4:3A:7C），可覆盖安装上一版
- **安装**：下载 APK → 设置 → 安全 → 允许未知来源 → 打开安装
- **源码**：https://github.com/Fable-Dzx/ytdroid"
            echo "::notice::已发布 Release ${TAG}"
          fi
